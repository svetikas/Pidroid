[project]
name = "pidroid-bot"
version = "26.9.1"
description = "Pidroid Discord bot for TheoTown"
authors = [{ name = "Dominykas Svetikas", email = "dominykas@svetikas.lt" }]
requires-python = "~=3.12,<3.14"
readme = "README.md"
license = "MIT"
dependencies = [
    "discord-py~=2.7.1",
    "python-dateutil>=2.9.0.post0,<3",
    "sqlalchemy>=2.0.43,<3",
    "asyncpg>=0.30.0,<0.31",
    "jishaku>=2.5.2,<3",
    "aiohttp>=3.14.3,<4",
    "pytz~=2025.2",
    "psutil>=7.0.0,<8",
    "pillow>=12.3.0,<12.4",
    "aiofiles>=24.1.0,<25",
    "aiodbm>=0.4.2,<0.5",
    "aiocron~=2.1",
    "emoji>=2.12.1,<3",
    "alembic>=1.16.5,<2",
    "python-dotenv>=1.2.2,<2",
    "dill>=0.4.0,<0.5",
    "pynacl>=1.6.2,<2",
    "greenlet>=3.2.4,<3.3",
    "pyjwt>=2.13.0",
    "faststream[rabbit]>=0.6.4",
    "imagehash>=4.3.2",
]

[project.optional-dependencies]
uvloop = ["uvloop>=0.19.0,<0.20"]

[project.scripts]
bot = "pidroid.main:main"
migrate = "pidroid.main:migrate"


[dependency-groups]
dev = [
    "coverage>=7.10.0,<7.11",
    "pytest>=9.0.3,<9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pidroid"]

[tool.basedpyright]
ignore = ["alembic/versions"]
reportMissingTypeStubs = false
reportUnusedCallResult = false
pythonVersion = "3.12"

[tool.ruff.lint]
select = [
    "ALL",
]
ignore = [
    "CPY001",  # Missing copyright notice at top of file


    "D100",    # Missing docstring in public module
    "D104",    # Missing docstring in public package
    "D107",    # Missing docstring in `__init__`
]

[tool.uv]
exclude-newer = "2099-01-01T00:00:00Z"
